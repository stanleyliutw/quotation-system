<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>內部分機查詢</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f5f5;color:#153438;font:16px/1.5 system-ui,sans-serif}
main{width:min(1080px,calc(100% - 48px));margin:32px auto;padding:32px;background:white;border:1px solid #d7e3e2;border-radius:14px}
a{color:#09665b;text-underline-offset:3px}
h1{margin:16px 0 24px;line-height:1.2}
label{display:block;margin-bottom:8px;font-weight:600}
input{width:min(100%,420px);min-height:44px;padding:10px 12px;font:inherit;color:inherit;border:1px solid #a9bfbd;border-radius:8px}
input:focus-visible,a:focus-visible{outline:2px solid #09665b;outline-offset:3px}
#status{margin:12px 0 16px;color:#516a6c}
.table-wrap{overflow-x:auto;border:1px solid #d7e3e2;border-radius:10px}
table{width:100%;min-width:700px;border-collapse:collapse}
th,td{text-align:left;vertical-align:middle;padding:12px 14px;border-bottom:1px solid #d7e3e2}
th{background:#eaf3f1;white-space:nowrap}
td:first-child,td:nth-child(5){white-space:nowrap}
td:nth-child(5){font-variant-numeric:tabular-nums}
tbody tr:last-child td{border-bottom:0}
tbody tr:nth-child(even){background:#f7faf9}
@media(max-width:600px){main{width:calc(100% - 24px);margin:12px auto;padding:16px}h1{margin-bottom:20px;font-size:26px}th,td{padding:10px 12px}}
</style>
<main><a href="index.html">← 返回首頁</a><h1>內部分機查詢</h1>
<label for="query">中文姓名、英文名或 Email</label><input id="query" type="search">
<p id="status" role="status"></p>
<div class="table-wrap" tabindex="0" role="region" aria-label="分機查詢結果"><table><thead><tr><th>姓名</th><th>部門</th><th>職稱</th><th>英文名</th><th>分機</th><th>Email</th></tr></thead><tbody></tbody></table></div></main>
<script>
const directory=[

 ["湯明澤","業務部","經理","Miguel Tang","142","migueltang"],

];
const query=document.getElementById('query');
const statusLine=document.getElementById('status');
const body=document.querySelector('tbody');
function render(){
 const key=query.value.trim().toLowerCase();
 const matches=directory.filter(([name,,,english,,mail])=>[name,english,mail+'@windner.com'].some(value=>value.toLowerCase().includes(key)));
 body.replaceChildren(...matches.map(([name,department,title,english,extension,mail])=>{
  const row=document.createElement('tr');
  for(const value of [name,department,title,english,extension||'未提供']) row.insertCell().textContent=value;
  const email=mail+'@windner.com';
  const link=document.createElement('a');
  link.href='mailto:'+email;
  link.textContent=email;
  row.insertCell().append(link);
  return row;
 }));
 statusLine.textContent=matches.length?'共 '+matches.length+' 筆':'查無符合資料';
}
query.addEventListener('input',render);
render();
</script></html>
