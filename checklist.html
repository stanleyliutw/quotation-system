<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Windner 自檢表查詢系統</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f5;color:#153438;font:16px system-ui,sans-serif}header{background:#103638;color:white;padding:42px max(5vw,20px)}h1{margin:10px 0;font-size:clamp(26px,4vw,42px)}p{line-height:1.6}main{max-width:1150px;margin:auto;padding:24px;display:grid;grid-template-columns:240px 1fr;gap:22px}aside,article{background:white;border:1px solid #d7e3e2;border-radius:14px;padding:20px;align-self:start}aside button{display:block;width:100%;text-align:left;margin:5px 0}button,select,input{font:inherit;color:inherit;border:1px solid #b9cfcc;border-radius:7px;background:white;padding:8px}button{cursor:pointer}button[aria-current=true],.primary{background:#09665b;color:white;border-color:#09665b}h2{margin:0}label{display:block}#case{display:flex;gap:8px;flex-wrap:wrap}#case input{min-width:130px;flex:1}#summary{font-weight:bold}progress{width:100%;accent-color:#09665b}.row{display:grid;grid-template-columns:minmax(155px,1fr) 120px minmax(120px,1fr);gap:8px;align-items:center;padding:13px 0;border-bottom:1px solid #d7e3e2}.row input{width:100%}.actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}small{color:#516a6c}@media(max-width:700px){main{grid-template-columns:1fr;padding:12px}aside{display:grid;grid-template-columns:1fr 1fr;gap:5px}aside button{margin:0}.row{grid-template-columns:1fr 106px}.row input{grid-column:1/-1}}@media print{aside,.actions,#case button{display:none}main{display:block}header{padding:16px;background:white;color:black}}
</style><header><strong>WINDNER</strong><h1>自檢表查詢系統</h1><div>交接前核對表單，補齊附件並留存單號。</div></header><main><aside><label for="search">搜尋流程、單位、表單或程序</label><input id="search" type="search" style="width:100%;margin:8px 0"><div id="nav" aria-label="工作流程"></div><small id="result" role="status"></small></aside><article><form id="case"><input id="caseId" required aria-label="案件或工單編號" placeholder="案件／工單編號"><button>開啟案件</button></form><p><small id="active"></small></p><h2 id="title"></h2><p id="handoff"></p><section><h3>作業程序</h3><ol id="steps"></ol></section><h3>應附表單與紀錄</h3><div id="summary" aria-live="polite"></div><progress id="meter" aria-label="文件完成進度"></progress><div id="rows"></div><div class="actions"><button id="export" class="primary">匯出案件 CSV</button><button onclick="window.print()">列印目前流程</button></div><p><small>此為流程範本，正式表單名稱與必附條件請依公司 SOP 確認。資料儲存在目前瀏覽器。選擇「不適用」時請填寫原因。</small></p></article></main><script>
const flows=[["客戶建檔與報價","業務 → 財務／工程","客戶基本資料與統編|交易條件及信用審核|RFQ、圖面與規格|成本估算與報價簽核|報價單及版次"],["接單與合約審查","業務 → 生管／工程／品保","客戶採購單|報價單與訂單差異確認|最新版承認圖及驗收條件|交期確認與訂單審查|客戶合約及條款審查（有新約或修訂時）"],["新產品導入與試產","工程 → 生產／品保／生管","產品圖面、BOM 與製程流程圖|DFMEA 與 PFMEA（依專案要求）|管制計畫與檢驗規範|試產工單與試產報告|首件檢驗與樣品承認紀錄"],["採購與進料","採購 → 倉管／品保／財務","請購單與核准紀錄|採購單與採購規格|供應商送貨單|材質證明或 CoC（依採購要求）|進料檢驗紀錄與驗收入庫單"],["排程與生產","生管 → 倉管／生產／品保","工單及排程|圖面與製程作業指導書|領料單與批號紀錄|首件及製程檢驗紀錄|完工回報與入庫單"],["委外加工","生管／採購 → 委外商／倉管／品保","委外加工單|加工圖面及表面處理規格|委外出庫及批號明細|委外商送貨單|委外回廠檢驗及相關製程證明（依要求）"],["工程變更","工程 → 業務／生管／採購／品保","工程變更申請與核准紀錄|新舊版圖面／BOM 差異|庫存、在製品與在途物料處置|生效日期或切換批號|客戶承認紀錄（依客戶要求）"],["異常與客訴","品保 → 工程／生產／採購／業務","不合格報告及影響批次|隔離與處置紀錄|特採／重工核准（適用時）|改善報告或 8D（依要求）|效果驗證與結案紀錄"],["出貨與請款","倉管／品保 → 業務／財務","客戶訂單與出貨指示|出貨檢驗紀錄（依規範採 AQL 或其他方案）|裝箱單及批次明細|銷貨單與簽收／物流憑證|發票與對帳資料"]].map(([title,handoff,items])=>({title,handoff,items:items.split('|')}));
const get=id=>document.getElementById(id);
const procedures=["取得統編、抬頭及交易條件|確認客戶是否已建檔並送財務審核|由工程確認圖面版次、規格及成本|完成報價簽核後發出報價並留存版本","核對客戶採購單與報價單|請工程及品保確認圖面與驗收條件|由生管確認交期，遇差異先取得客戶書面確認|完成訂單審查後於 ERP 建立訂單","確認承認圖、BOM 與製程|依專案要求完成風險分析及管制計畫|安排試產並執行首件檢驗|完成樣品承認後交接量產","提出請購並完成核准|確認採購規格與交期後發單|到貨時核對數量、批號及隨貨證明|品保判定合格後辦理 ERP 驗收入庫","依訂單交期建立工單及排程|確認圖面版次並依批號領料|生產執行首件及製程檢驗，異常先隔離|回報完工數量並辦理入庫","確認委外規格、交期與驗收要求|建立委外單並依批號辦理出庫|回廠時核對數量及製程證明|品保檢驗後辦理入庫或異常處置","提出變更申請並確認影響範圍|評估庫存、在製品與在途物料的處置|完成內部核准及必要的客戶承認|公告生效日期或切換批號並更新文件","登錄異常及影響批次並立即隔離|與相關單位確認原因、處置及責任人|完成必要的重工或特採核准並執行改善|驗證改善效果後結案","依 ERP 訂單及出貨指示備貨|確認出貨檢驗、包裝及批號明細|在 ERP 開立銷貨單並留存簽收或物流憑證|由財務依憑證開票與對帳"].map(text=>text.split('|'));
function renderNavigation(){
 const keywords=get('search').value.toLowerCase().trim().split(/\s+/);
 const buttons=flows.flatMap((flow,index)=>{
 const searchable=[flow.title,flow.handoff,...flow.items,...procedures[index]].join(' ').toLowerCase();
 if(!keywords.every(word=>searchable.includes(word))) return [];
 const button=document.createElement('button');
 button.textContent=flow.title;
 button.setAttribute('aria-current',index===flowIndex);
 button.onclick=()=>{flowIndex=index;render()};
 return [button];
 });
 get('nav').replaceChildren(...buttons);
 get('result').textContent=buttons.length?'共 '+buttons.length+' 項流程':'查無符合的流程';
}
get('search').oninput=renderNavigation;
const statuses=['待補','已檢附','不適用'];
const storageKey='windner-checklist-v1';
let records=JSON.parse(localStorage.getItem(storageKey)||'{}');
let flowIndex=0, caseId='';
const provisional='draft';
function entry(f,i){return records[JSON.stringify([caseId||provisional,!!caseId,f,i])]||{status:'待補',note:''}}
function updateProgress(){
 const flow=flows[flowIndex];
 const entries=flow.items.map((_,i)=>entry(flowIndex,i));
 const attached=entries.filter(x=>x.status==='已檢附').length;
 const excluded=entries.filter(x=>x.status==='不適用'&&x.note.trim()).length;
 get('summary').textContent='已檢附 '+attached+'　待確認 '+(entries.length-attached-excluded)+'　不適用 '+excluded;
 get('meter').max=entries.length;get('meter').value=attached+excluded;
}
function render(){
 const flow=flows[flowIndex];
 get('active').textContent=caseId?'目前案件 '+caseId:'目前使用未命名草稿';
 get('title').textContent=flow.title;get('handoff').textContent=flow.handoff;
 renderNavigation();
 get('steps').replaceChildren(...procedures[flowIndex].map(text=>{
 const item=document.createElement('li');
 item.textContent=text;
 return item;
 }));
 get('rows').replaceChildren(...flow.items.map((name,i)=>{
 const container=document.createElement('div');container.className='row';
 const title=document.createElement('span');title.textContent=name;
 const select=document.createElement('select');select.setAttribute('aria-label',name+'狀態');
 statuses.forEach(status=>select.add(new Option(status,status)));
 const note=document.createElement('input');note.setAttribute('aria-label',name+'單號或備註');
 const saved=entry(flowIndex,i);select.value=saved.status;note.value=saved.note;
 function save(){
 records[JSON.stringify([caseId||provisional,!!caseId,flowIndex,i])]={status:select.value,note:note.value};
 localStorage.setItem(storageKey,JSON.stringify(records));
 note.placeholder=select.value==='不適用'?'填寫不適用原因':'單號／檔案連結／備註';
 updateProgress();
 }
 select.onchange=save;note.oninput=save;
 note.placeholder=saved.status==='不適用'?'填寫不適用原因':'單號／檔案連結／備註';
 container.append(title,select,note);return container;
 }));
 updateProgress();
}
get('case').onsubmit=e=>{e.preventDefault();const next=get('caseId').value.trim();if(next){caseId=next;render()}};
get('export').onclick=()=>{
 const rows=[['案件','流程','交接單位','表單','狀態','單號／備註']];
 flows.forEach((flow,f)=>flow.items.forEach((item,i)=>{
 const value=entry(f,i);
 rows.push([caseId,flow.title,flow.handoff,item,value.status==='不適用'&&!value.note.trim()?'待確認不適用原因':value.status,value.note]);
 }));
 const csv=rows.map(row=>row.map(value=>'"'+(/^[\s\uFEFF]*[=+@-]|^[\t\r\n]/.test(value)?"'":"")+value.replaceAll('"','""')+'"').join(',')).join('\r\n');
 const url=URL.createObjectURL(new Blob(['\uFEFF',csv],{type:'text/csv;charset=utf-8'}));
 const anchor=document.createElement('a');anchor.href=url;anchor.download='Windner-checklist.csv';anchor.click();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
};
render();
</script></html>
