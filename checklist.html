<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Windner 自檢表查詢系統</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f5;color:#153438;font:16px system-ui,sans-serif}header{background:#103638;color:white;padding:42px max(5vw,20px)}h1{margin:10px 0;font-size:clamp(26px,4vw,42px)}p{line-height:1.6}main{max-width:1150px;margin:auto;padding:24px;display:grid;grid-template-columns:240px 1fr;gap:22px}aside,article{background:white;border:1px solid #d7e3e2;border-radius:14px;padding:20px;align-self:start}aside button{display:block;width:100%;text-align:left;margin:5px 0}button,select,input{font:inherit;color:inherit;border:1px solid #b9cfcc;border-radius:7px;background:white;padding:8px}button{cursor:pointer}button[aria-current=true],.primary{background:#09665b;color:white;border-color:#09665b}h2{margin:0}label{display:block}#case{display:flex;gap:8px;flex-wrap:wrap}#case input{min-width:130px;flex:1}#summary{font-weight:bold}progress{width:100%;accent-color:#09665b}.row{display:grid;grid-template-columns:minmax(155px,1fr) 120px minmax(120px,1fr);gap:8px;align-items:center;padding:13px 0;border-bottom:1px solid #d7e3e2}.row input{width:100%}.actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}small{color:#516a6c}@media(max-width:700px){main{grid-template-columns:1fr;padding:12px}aside{display:grid;grid-template-columns:1fr 1fr;gap:5px}aside button{margin:0}.row{grid-template-columns:1fr 106px}.row input{grid-column:1/-1}}@media print{aside,.actions,#case button{display:none}main{display:block}header{padding:16px;background:white;color:black}}
.row{display:flex;gap:12px;cursor:pointer}.row input[type=checkbox]{width:20px;height:20px;flex:none;accent-color:#09665b}</style><header><strong>WINDNER</strong><h1>自檢表查詢系統</h1><div>選擇送件流程，查詢交接單位、送件程序及應附文件。送出前可逐項勾選確認。</div></header><main><aside><label for="search">搜尋流程、交接單位、附件或程序</label><input id="search" type="search" style="width:100%;margin:8px 0"><div id="nav" aria-label="工作流程"></div><small id="result" role="status"></small></aside><article><h2 id="title"></h2><p id="handoff"></p><section><h3>送件與交接程序</h3><ol id="steps"></ol></section><h3>應附表單、附件與紀錄</h3><div id="summary" aria-live="polite"></div><progress id="meter" aria-label="文件完成進度"></progress><div id="rows"></div><div class="actions"><button id="reset" type="button">清除目前勾選</button><button onclick="window.print()">列印目前流程</button></div><p><small>送件前請依公司 SOP 確認必附文件與適用條件。勾選僅在本次開啟頁面期間保留。</small></p></article></main><script>
const flows=[["客戶建檔與報價","業務 → 財務／工程","客戶基本資料與統編|交易條件及信用審核|RFQ、圖面與規格|成本估算與報價簽核|報價單及版次"],["接單與合約審查","業務 → 生管／工程／品保","客戶採購單|報價單與訂單差異確認|最新版承認圖及驗收條件|交期確認與訂單審查|客戶合約及條款審查（有新約或修訂時）"],["新產品導入與試產","工程 → 生產／品保／生管","產品圖面、BOM 與製程流程圖|DFMEA 與 PFMEA（依專案要求）|管制計畫與檢驗規範|試產工單與試產報告|首件檢驗與樣品承認紀錄"],["採購與進料","採購 → 倉管／品保／財務","請購單與核准紀錄|採購單與採購規格|供應商送貨單|材質證明或 CoC（依採購要求）|進料檢驗紀錄與驗收入庫單"],["排程與生產","生管 → 倉管／生產／品保","工單及排程|圖面與製程作業指導書|領料單與批號紀錄|首件及製程檢驗紀錄|完工回報與入庫單"],["委外加工","生管／採購 → 委外商／倉管／品保","委外加工單|加工圖面及表面處理規格|委外出庫及批號明細|委外商送貨單|委外回廠檢驗及相關製程證明（依要求）"],["工程變更","工程 → 業務／生管／採購／品保","工程變更申請與核准紀錄|新舊版圖面／BOM 差異|庫存、在製品與在途物料處置|生效日期或切換批號|客戶承認紀錄（依客戶要求）"],["異常與客訴","品保 → 工程／生產／採購／業務","不合格報告及影響批次|隔離與處置紀錄|特採／重工核准（適用時）|改善報告或 8D（依要求）|效果驗證與結案紀錄"],["出貨與請款","倉管／品保 → 業務／財務","客戶訂單與出貨指示|出貨檢驗紀錄（依規範採 AQL 或其他方案）|裝箱單及批次明細|簽收／物流憑證|訂單列印件|銷貨單列印件|採購單列印件|發票與對帳資料"]].map(([title,handoff,items])=>({title,handoff,items:items.split('|')}));
const get=id=>document.getElementById(id);
const procedures=["取得統編、抬頭及交易條件|確認客戶是否已建檔並送財務審核|由工程確認圖面版次、規格及成本|完成報價簽核後發出報價並留存版本","核對客戶採購單與報價單|請工程及品保確認圖面與驗收條件|由生管確認交期，遇差異先取得客戶書面確認|完成訂單審查後於 ERP 建立訂單|在 ERP 建立訂單時，將客戶訂單的掃描檔上傳至該筆 ERP 訂單的附件，並確認已儲存。","確認承認圖、BOM 與製程|依專案要求完成風險分析及管制計畫|安排試產並執行首件檢驗|完成樣品承認後交接量產","提出請購並完成核准|確認採購規格與交期後發單|到貨時核對數量、批號及隨貨證明|品保判定合格後辦理 ERP 驗收入庫","依訂單交期建立工單及排程|確認圖面版次並依批號領料|生產執行首件及製程檢驗，異常先隔離|回報完工數量並辦理入庫","確認委外規格、交期與驗收要求|建立委外單並依批號辦理出庫|回廠時核對數量及製程證明|品保檢驗後辦理入庫或異常處置","提出變更申請並確認影響範圍|評估庫存、在製品與在途物料的處置|完成內部核准及必要的客戶承認|公告生效日期或切換批號並更新文件","登錄異常及影響批次並立即隔離|與相關單位確認原因、處置及責任人|完成必要的重工或特採核准並執行改善|驗證改善效果後結案","依 ERP 訂單及出貨指示備貨|確認出貨檢驗、包裝及批號明細|在 ERP 開立銷貨單並留存簽收或物流憑證|將訂單、銷貨單及採購單三份列印件一併送交財務開立發票|由財務依憑證開票與對帳"].map(text=>text.split('|'));
function renderNavigation(){
 const keywords=get('search').value.toLowerCase().trim().split(/\s+/);
 const buttons=flows.flatMap((flow,index)=>{
 const searchable=[flow.title,flow.handoff,...flow.items,...procedures[index]].join(' ').toLowerCase();
 if(!keywords.every(word=>searchable.includes(word))) return [];
 const button=document.createElement('button');
 button.textContent=flow.title;
 button.setAttribute('aria-current',index===flowIndex);
 button.onclick=()=>{flowIndex=index;render()};
 return [button];
 });
 get('nav').replaceChildren(...buttons);
 get('result').textContent=buttons.length?'共 '+buttons.length+' 項流程':'查無符合的流程';
}
get('search').oninput=renderNavigation;
const checkedByFlow=flows.map(()=>new Set());
let flowIndex=0;
function updateProgress(){
 const total=flows[flowIndex].items.length;
 const checked=checkedByFlow[flowIndex].size;
 get('summary').textContent='已確認 '+checked+'／'+total+' 項';
 get('meter').max=total;
 get('meter').value=checked;
}
function render(){
 const flow=flows[flowIndex];

 get('title').textContent=flow.title;get('handoff').textContent='交接單位：'+flow.handoff;
 renderNavigation();
 get('steps').replaceChildren(...procedures[flowIndex].map(text=>{
 const item=document.createElement('li');
 item.textContent=text;
 return item;
 }));
 get('rows').replaceChildren(...flow.items.map((name,index)=>{
 const label=document.createElement('label');
 label.className='row';
 const checkbox=document.createElement('input');
 checkbox.type='checkbox';
 const checked=checkedByFlow[flowIndex];
 checkbox.checked=checked.has(index);
 checkbox.onchange=()=>{
  if(checkbox.checked) checked.add(index);
  else checked.delete(index);
  updateProgress();
 };
 label.append(checkbox,document.createTextNode(name));
 return label;
 }));
 updateProgress();
}
get('reset').onclick=()=>{checkedByFlow[flowIndex].clear();render()};
render();
</script></html>
